<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RedPoc CVE & KVE Archive - Official Vulnerability Contributions">
    <title>CVE Archive | RedPoc</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Tab System Styles */
        .tabs-container {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 15px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            padding: 10px 25px;
            transition: var(--transition);
            position: relative;
        }

        .tab-btn.active {
            color: var(--primary-red);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary-red);
            box-shadow: 0 0 10px var(--primary-red);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* Fixed Accordion for Original Clean Look */
        .accordion-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: var(--transition);
        }

        .accordion-card.open {
            border-color: rgba(255, 42, 42, 0.4);
            background: rgba(255, 255, 255, 0.02);
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            cursor: pointer;
        }

        .accordion-header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .accordion-tag {
            font-family: var(--font-mono);
            color: var(--primary-red);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .accordion-title {
            font-weight: 600;
            color: var(--text-main);
        }

        /* --- Multi-Contributor Group --- */
        /* --- Multi-Contributor Group --- */
        .contributor-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 4px 14px 4px 8px;
            gap: 10px;
            margin-left: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .contributor-group:hover {
            background: rgba(255, 42, 42, 0.05);
            border-color: rgba(255, 42, 42, 0.3);
            transform: translateY(-2px);
        }

        .avatar-stack {
            display: flex;
            flex-direction: row-reverse;
        }

        .avatar-stack img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--surface-color);
            margin-left: -12px;
            background: var(--surface-color);
            transition: transform 0.3s ease;
            object-fit: cover;
        }

        .avatar-stack img:last-child { margin-left: 0; }

        .contributor-group span {
            font-size: 0.8rem;
            font-weight: 700;
            color: #777;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Contributor Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            width: 90%;
            max-width: 500px;
            max-height: 85vh; /* Prevent off-screen */
            overflow-y: auto; /* Allow scrolling content */
            border-radius: 16px;
            padding: 30px;
            position: relative;
            transform: scale(0.95);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            -webkit-overflow-scrolling: touch; /* smooth scroll on iOS */
        }

        @media (max-width: 480px) {
            .modal-card { padding: 25px 15px; width: 95%; max-height: 90vh; }
            .modal-header { margin-bottom: 20px; }
            .modal-list { gap: 15px; }
            .modal-item { width: 110px; padding: 15px; }
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h3 {
            font-family: var(--font-mono);
            color: var(--primary-red);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .modal-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .modal-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            width: 120px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            cursor: default;
        }

        .modal-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 42, 42, 0.2);
            transform: translateY(-5px);
        }

        .modal-item img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--primary-red);
            box-shadow: 0 4px 15px rgba(255, 42, 42, 0.15);
        }

        .modal-item-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: var(--font-mono);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover { color: var(--primary-red); }

        .header-contributor {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            margin-left: 15px;
            transition: var(--transition);
        }
        .header-contributor:hover { border-color: rgba(255,42,42,0.3); background: rgba(255,255,255,0.06); }

        .header-contributor img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary-red);
            object-fit: cover;
        }

        .header-contributor span {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: var(--font-mono);
        }

        .accordion-toggle {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--surface-border);
            border-radius: 50%;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .accordion-card.open .accordion-toggle {
            transform: rotate(45deg);
            background: rgba(255, 42, 42, 0.1);
            color: var(--primary-red);
            border-color: var(--primary-red);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .accordion-body-inner {
            padding: 20px 30px 25px 30px;
            border-top: 1px solid var(--surface-border);
        }

        /* Tighter Meta Dashboard */
        .meta-dashboard {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px;
            margin-bottom: 25px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .meta-label {
            font-size: 0.7rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .impact-bar-track {
            width: 70px;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .impact-bar-fill {
            height: 100%;
            width: 0;
            background: var(--sev-color);
            box-shadow: 0 0 10px var(--sev-color);
            transition: width 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .open .impact-bar-fill.moderate { width: 55%; }
        .open .impact-bar-fill.high { width: 85%; }

        .score-val {
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 1rem;
            color: var(--sev-color);
        }

        .target-tag {
            font-size: 0.85rem;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-weight: 600;
        }

        .moderate { --sev-color: #facc15; }
        .high { --sev-color: #fb923c; }

        @media (max-width: 768px) {
            .tabs-container { gap: 8px; }
            .tab-btn { padding: 8px 12px; font-size: 0.85rem; }
            
            .accordion-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 20px;
            }

            .header-contributor, .contributor-group {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
                padding: 10px;
            }

            .accordion-toggle {
                position: absolute;
                top: 20px;
                right: 20px;
            }

            .accordion-tag {
                font-size: 1.1rem;
                margin-bottom: 5px;
            }

            .meta-dashboard {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
                gap: 18px;
                padding: 15px;
            }

            .meta-item { width: 100%; justify-content: space-between; }
            .impact-bar-track { width: 100px; }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="redpoc.png" alt="RedPoc Logo">
            <h1>Red<span>Poc</span></h1>
        </a>
        <button class="menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="main-nav">
            <a href="index.html" data-i18n="nav_home">홈</a>
            <a href="cve.html" class="active" data-i18n="nav_cve">CVE 아카이브</a>
            <a href="research.html" data-i18n="nav_research">연구</a>
            <a href="team.html" data-i18n="nav_team">팀</a>
            <button id="lang-toggle-btn" onclick="toggleLanguage()"
                style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#888;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:0.8rem;font-family:inherit;transition:all 0.3s;margin-left:10px;"
                onmouseover="this.style.borderColor='#ff2a2a';this.style.color='#ff2a2a'"
                onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='#888'">English</button>
        </nav>
    </header>

    <div class="container">
        <section class="hero reveal">
            <div class="hero-badge" data-i18n="cve_badge">취약점 아카이브</div>
            <h2 data-i18n="cve_hero_title">CVE Archive</h2>
            <p data-i18n="cve_hero_desc">RedPoc 팀이 발견하고 보고한 주요 보안 취약점 리스트입니다.</p>
            
            <!-- Stats Dashboard Integrated for Tighter Layout -->
            <div class="stats-container reveal" style="margin-top: 25px;">
                <div class="stats-badge">
                    <span class="stats-number" id="stats-total">0</span>
                    <span class="stats-label" data-i18n="stats_total_discoveries">Total Discoveries</span>
                </div>
            </div>
        </section>

        <section class="reveal" style="margin-top: 40px;">

            <div class="tabs-container">
            <button class="tab-btn active" onclick="openTab(event, 'cve-tab')" data-i18n="cve_tab_cve">CVE TRACK</button>
            <button class="tab-btn" onclick="openTab(event, 'kve-tab')" data-i18n="cve_tab_kve">KVE & OTHERS</button>
        </div>

        <!-- CVE CONTENT -->
        <div id="cve-tab" class="tab-content active">
            <!-- Dynamically populated from cve_data.js -->
        </div>

        <!-- KVE CONTENT -->
        <div id="kve-tab" class="tab-content">
            <!-- Dynamically populated from cve_data.js -->
        </div>
    </div>

    <footer>
        <p data-i18n="footer_copy">© 2026 RedPoc Team | All Rights Reserved</p>
    </footer>

    <!-- Contributor Modal -->
    <div id="contributor-modal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-header">
                <h3 data-i18n="cve_label_collab">Colleagues</h3>
                <p style="font-size: 0.8rem; color: #555;" data-i18n="modal_desc">Research Team for this vulnerability</p>
            </div>
            <div id="modal-content" class="modal-list">
                <!-- Content will be injected by JS -->
            </div>
        </div>
    </div>

    <script src="team_data.js"></script>
    <script src="cve_data.js"></script>
    <script src="i18n.js"></script>
    <script>
        function renderCVEs() {
            const lang = localStorage.getItem('redpoc_lang') || 'ko';
            const cveContainer = document.getElementById('cve-tab');
            const kveContainer = document.getElementById('kve-tab');

            // Sort helper: Descending ID (latest first)
            const sortById = (a, b) => (b.id || "").localeCompare(a.id || "", undefined, {numeric: true, sensitivity: 'base'});

            const sortedCVEs = [...CVE_DATA.cves].sort(sortById);
            const sortedKVEs = [...CVE_DATA.kves].sort(sortById);

            // Render
            cveContainer.innerHTML = sortedCVEs.map((cve, idx) => generateCardHTML(cve, idx, lang)).join('');
            kveContainer.innerHTML = sortedKVEs.map((kve, idx) => generateCardHTML(kve, idx, lang)).join('');

            // Re-apply observers
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        function generateCardHTML(item, idx, lang) {
            const hasMultiple = item.contributors.length > 1;
            const singleContributor = hasMultiple ? null : TEAM_DATA.members[item.contributors[0]];
            const cardId = `card-${item.id}`;

            let contributorHTML = '';
            if (hasMultiple) {
                // Show avatars up to 3
                const avatars = item.contributors.slice(0, 3).map(id => {
                    const m = TEAM_DATA.members[id];
                    return `<img src="${m ? m.img : ''}" alt="${id}" onerror="this.src='https://ui-avatars.com/api/?name=${id}'">`;
                }).join('');
                
                contributorHTML = `
                    <div class="contributor-group" onclick="event.stopPropagation(); openDetailModal('${item.id}', true)">
                        <div class="avatar-stack">${avatars}</div>
                        <span style="font-size:0.75rem; color:#888; margin-left:8px;">${getI18n('cve_label_collab')}</span>
                    </div>
                `;
            } else if (singleContributor) {
                contributorHTML = `
                    <div class="header-contributor">
                        <img src="${singleContributor.img}" alt="${singleContributor.name}" onerror="this.src='https://ui-avatars.com/api/?name=${singleContributor.name}'">
                        <span>${singleContributor.name}</span>
                    </div>
                `;
            }

            return `
                <div class="accordion-card reveal" id="${cardId}">
                    <div class="accordion-header" onclick="toggleAccordion('${cardId}')">
                        <div class="accordion-header-left">
                            <span class="accordion-tag">${item.id}</span>
                            <span class="accordion-title">${item.title[lang]}</span>
                            ${contributorHTML}
                        </div>
                        <div class="accordion-toggle">+</div>
                    </div>
                    <div class="accordion-body">
                        <div class="accordion-body-inner">
                            <div class="meta-dashboard">
                                <div class="meta-item ${item.severity}">
                                    <span class="meta-label">${getI18n('cve_label_impact')}</span>
                                    <div class="impact-bar-track"><div class="impact-bar-fill ${item.severity}" style="width: ${item.impact * 10}%"></div></div>
                                    <span class="score-val">${item.impact}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">${getI18n('cve_label_target')}</span>
                                    <span class="target-tag">${item.target}</span>
                                </div>
                            </div>
                            <p>${item.summary[lang]}</p>
                            <div style="margin-top:20px; display:flex; justify-content:flex-end; gap: 10px;">
                                <button class="btn" style="padding: 8px 15px; font-size: 0.8rem;" onclick="copyId('${item.id}', this)">${getI18n('cve_btn_copy')}</button>
                                <a href="${item.advisory || item.detail_link || '#'}" class="btn btn-primary" style="padding: 8px 18px; font-size: 0.8rem;">${item.advisory ? getI18n('cve1_btn') : getI18n('cve2_btn')}</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openDetailModal(id, isCVE) {
            const lang = localStorage.getItem('redpoc_lang') || 'ko';
            const content = document.getElementById('modal-content');
            let memberIds = [];

            if (isCVE) {
                const item = [...CVE_DATA.cves, ...CVE_DATA.kves].find(c => c.id === id);
                memberIds = item ? item.contributors : [];
            } else {
                memberIds = [id];
            }

            content.innerHTML = memberIds.map(mid => {
                const m = TEAM_DATA.members[mid];
                if (!m) return '';
                return `
                    <div class="modal-item">
                        <img src="${m.img}" alt="${m.name}" onerror="this.src='https://ui-avatars.com/api/?name=${m.name}'">
                        <span class="modal-item-name">${m.name}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('contributor-modal').classList.add('active');
            document.body.classList.add('no-scroll');
        }

        function closeModal() {
            document.getElementById('contributor-modal').classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        function openTab(evt, tabName) {
            const tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            const tablinks = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function toggleAccordion(id) {
            const card = document.getElementById(id);
            const body = card.querySelector('.accordion-body');
            const isOpen = card.classList.contains('open');

            if (isOpen) {
                body.style.maxHeight = '0';
                card.classList.remove('open');
            } else {
                body.style.maxHeight = body.scrollHeight + 'px';
                card.classList.add('open');
            }
        }

        async function copyId(text, btn) {
            event.stopPropagation();
            try {
                await navigator.clipboard.writeText(text);
                const ot = btn.textContent;
                btn.textContent = getI18n('cve_btn_copied');
                btn.style.borderColor = '#4ade80';
                btn.style.color = '#4ade80';
                setTimeout(() => {
                    btn.textContent = ot;
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }, 2000);
            } catch (err) {}
        }

        // Initialize and listen for language changes
        document.addEventListener('DOMContentLoaded', () => {
            renderCVEs();
            // Fallback: If stats-container is at the top (already visible)
            const stats = document.querySelector('.stats-container');
            if(stats && stats.getBoundingClientRect().top < window.innerHeight) {
                updateStats();
            }
        });

        const _origToggle = window.toggleLanguage;
        window.toggleLanguage = function() {
            if (typeof _origToggle === 'function') _origToggle();
            renderCVEs();
        };

        const menuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');
        const body = document.body;

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            mainNav.classList.toggle('open');
            body.classList.toggle('no-scroll');
        });

        mainNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                mainNav.classList.remove('open');
                body.classList.remove('no-scroll');
            });
        });

        // Interactive Background Glow
        const glow = document.querySelector('.bg-glow');
        document.addEventListener('mousemove', (e) => {
            if (glow) {
                const x = e.clientX - 300;
                const y = e.clientY - 300;
                glow.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Scroll Reveal Implementation
        const observerOptions = {
            threshold: 0,
            rootMargin: "0px 0px 100px 0px"
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    if (entry.target.classList.contains('stats-container')) updateStats();
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        function updateStats() {
            const allItems = [...(CVE_DATA.cves || []), ...(CVE_DATA.kves || [])];
            animateCounter('stats-total', allItems.length);
        }

        function animateCounter(id, target) {
            const el = document.getElementById(id);
            if (!el) return;
            let current = 0;
            const duration = 1500;
            const stepTime = Math.max(duration / target, 50);
            const timer = setInterval(() => {
                current += 1;
                el.textContent = current;
                if (current >= target) clearInterval(timer);
            }, stepTime);
        }

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>

</html>
