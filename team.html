    <link rel="stylesheet" href="style.css">
    <style>
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .member-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 0;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 420px; /* Reduced height */
        }

        .member-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-red), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            z-index: 2;
        }

        .member-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 42, 42, 0.4);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .member-card:hover::before {
            transform: translateX(100%);
        }

        .avatar-section {
            padding: 25px 20px 15px 20px; /* Reduced 여백 */
        }

        .avatar-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 2px solid var(--primary-red);
            box-shadow: none; /* Glow 제거 */
            overflow: hidden;
            background: transparent;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .member-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0;
            color: var(--text-main);
        }

        .member-role {
            font-family: var(--font-mono);
            color: var(--primary-red);
            font-size: 0.95rem; /* 크기 키움 */
            padding: 10px 20px; /* 여백 줄임 */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.01);
            white-space: pre-line;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-desc {
            color: var(--text-muted);
            font-size: 0.95rem; /* 크기 키움 */
            line-height: 1.6;
            padding: 15px 25px; /* 여백 줄임 */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-section {
            padding: 15px; /* 여백 줄임 */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.1);
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            transition: var(--transition);
        }

        .github-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .github-link:hover {
            color: var(--text-main);
            border-color: var(--primary-red);
            background: rgba(255, 42, 42, 0.1);
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="redpoc.png" alt="RedPoc Logo">
            <h1>Red<span>Poc</span></h1>
        </a>
        <button class="menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="main-nav">
            <a href="index.html" data-i18n="nav_home">홈</a>
            <a href="cve.html" data-i18n="nav_cve">CVE 아카이브</a>
            <a href="research.html" data-i18n="nav_research">연구</a>
            <a href="team.html" class="active" data-i18n="nav_team">팀</a>
            <button id="lang-toggle-btn" onclick="toggleLanguage()"
                style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#888;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:0.8rem;font-family:inherit;transition:all 0.3s;margin-left:10px;"
                onmouseover="this.style.borderColor='#ff2a2a';this.style.color='#ff2a2a'"
                onmouseout="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='#888'">English</button>
        </nav>
    </header>

    <div class="container">
        <section class="hero reveal">
            <div class="hero-badge" data-i18n="team_badge">구성원</div>
            <h2 data-i18n="team_hero_title">팀 소개</h2>
            <p data-i18n="team_hero_desc">오펜시브 보안에 대한 열정으로 뭉친 보안 엔지니어 및 연구자들의 그룹입니다.</p>
        </section>

        <section class="reveal">
            <div class="team-grid" id="team-container">
                <!-- Dynamically populated from team_data.js -->
            </div>
        </section>
    </div>

    <footer>
        <div class="footer-links">
            <a href="https://github.com/redpoc" target="_blank">GitHub</a> •
            <a href="https://medium.com/@redpoc.team" target="_blank">Medium</a> •
            <a href="mailto:drkim1239@gmail.com">Contact</a>
        </div>
        <p style="margin-top: 15px;" data-i18n="footer_copy">© 2026 RedPoc Team | All Rights Reserved | redpoc.team@gmail.com</p>
    </footer>

    <!-- Scripts -->
    <script src="team_data.js"></script>
    <script src="i18n.js"></script>
    <script>
        function renderTeam() {
            const container = document.getElementById('team-container');
            const lang = localStorage.getItem('redpoc_lang') || 'ko';
            
            container.innerHTML = Object.values(TEAM_DATA.members).map((member, index) => `
                <div class="member-card reveal">
                    <div class="avatar-section">
                        <div class="avatar-wrapper">
                            <img src="${member.img}" alt="${member.name}"
                                onerror="this.src='https://ui-avatars.com/api/?name=${member.name}&background=1a0a0a&color=ff2a2a&size=100'">
                        </div>
                        <div class="member-name">${member.name}</div>
                    </div>
                    <div class="member-role">${member.role[lang]}</div>
                    <p class="member-desc">${member.desc[lang]}</p>
                    <div class="link-section">
                        <a href="https://github.com/${member.github}" target="_blank" class="github-link">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                            </svg>
                            @${member.name}
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Initialize and listen for language changes
        document.addEventListener('DOMContentLoaded', () => {
            renderTeam();
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
        
        // Wrap original toggle language function
        const _origToggle = window.toggleLanguage;
        window.toggleLanguage = function() {
            if (typeof _origToggle === 'function') _origToggle();
            renderTeam();
            // Re-observe new elements
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };

        // Mobile Menu Script
        const menuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');
        const body = document.body;
        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            mainNav.classList.toggle('open');
            body.classList.toggle('no-scroll');
        });
        mainNav.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                mainNav.classList.remove('open');
                body.classList.remove('no-scroll');
            });
        });

        // Interactive Background Glow
        const glow = document.querySelector('.bg-glow');
        document.addEventListener('mousemove', (e) => {
            if (glow) {
                const x = e.clientX - 300;
                const y = e.clientY - 300;
                glow.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Scroll Reveal Implementation
        const observerOptions = {
            threshold: 0,
            rootMargin: "0px 0px 200px 0px"
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>

</html>
