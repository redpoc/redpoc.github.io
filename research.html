<body>
    <div class="bg-glow"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="redpoc.png" alt="RedPoc Logo">

        </a>
        <button class="menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">

            <span></span>

            <a href="index.html" data-i18n="nav_home">홈</a>
            <a href="cve.html" data-i18n="nav_cve">CVE 아카이브</a>
            <a href="research.html" class="active" data-i18n="nav_research">연구</a>
            <a href="team.html" data-i18n="nav_team">팀</a>
            <button id="lang-toggle-btn" onclick="toggleLanguage()"
                style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#888;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:0.8rem;font-family:inherit;transition:all 0.3s;margin-left:10px;"

    <div class="container">
        <section class="hero reveal">
            <div class="hero-badge" data-i18n="research_badge">발행물</div>

            <p data-i18n="research_hero_desc">익스플로잇 기법, 리버스 엔지니어링, 오펜시브 방법론에 대한 심층 분석.</p>
        </section>

        <section class="reveal">
            <div class="grid" id="research-container">
                <!-- Dynamically populated from research_data.js -->
            </div>
        </section>

    </footer>

    <script src="research_data.js"></script>
    <script src="i18n.js"></script>
    <script>
        function renderResearch() {
            const lang = localStorage.getItem('redpoc_lang') || 'ko';
            const container = document.getElementById('research-container');
            
            container.innerHTML = RESEARCH_DATA.articles.map(article => `
                <div class="card reveal">
                    <div class="card-header">
                        <span class="card-tag">${article.tag[lang]}</span>
                    </div>
                    <h3>${article.title[lang]}</h3>
                    <p>${article.desc[lang]}</p>
                    <div class="card-footer" style="margin-top: 20px;">
                        <span>${article.date[lang]}</span>
                        <a href="${article.link}" class="btn" style="padding: 6px 15px; font-size: 0.8rem;">${getI18n('research_read_more')}</a>
                    </div>
                </div>
            `).join('');

            // Re-apply observers
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        document.addEventListener('DOMContentLoaded', renderResearch);

        const _origToggle = window.toggleLanguage;
        window.toggleLanguage = function() {
            if (typeof _origToggle === 'function') _origToggle();
            renderResearch();
        };
        const menuToggle = document.getElementById('mobile-menu-toggle');
        const mainNav = document.getElementById('main-nav');
        const body = document.body;

        if (menuToggle && mainNav) {
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                mainNav.classList.toggle('open');
                body.classList.toggle('no-scroll');
            });

            mainNav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    mainNav.classList.remove('open');
                    body.classList.remove('no-scroll');
                });
            });
        }

        // Interactive Background Glow
        const glow = document.querySelector('.bg-glow');
        document.addEventListener('mousemove', (e) => {
            if (glow) {
                const x = e.clientX - 300;
                const y = e.clientY - 300;
                glow.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // Scroll Reveal Implementation
        const observerOptions = {
            threshold: 0,
            rootMargin: "0px 0px 200px 0px"
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { entry.isIntersecting && (entry.target.classList.add('active'), observer.unobserve(entry.target)) });
        }, observerOptions);

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
    <script src="i18n.js"></script>
</body>

</html>
